<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Ray Peat Chatbot</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/img/favicon.png" type="image/png" sizes="144x144">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<!-- Spring Boot sirve este archivo (static/error/404.html) cuando una dirección no existe. -->
<body class="legal-page">
  <div class="frame">
    <header class="topbar">
      <a href="/" class="wordmark" aria-label="Inicio"><img src="/img/logo.png" alt="" class="logo" width="30" height="30"><span class="wordmark-name">Ray Peat</span></a>
      <nav class="actions">
        <a class="ghost" href="/">Volver al chat</a>
      </nav>
    </header>

    <main class="not-found">
      <img class="not-found-mascot" src="/img/mascota/reading.webp" alt="" width="173" height="240">
      <h1>Esta página no existe</h1>
      <p>Hemos buscado en todos sus artículos, libros y entrevistas, y nada.</p>
      <p lang="en" class="not-found-en">This page doesn't exist.</p>
      <p><a class="pill-link" href="/">Volver al chat</a></p>
    </main>
  </div>
</body>
</html>
