spring.application.name=rag-peat

# Conexión a la base de datos de compose.yaml.
# La sintaxis ${VARIABLE:valor} usa la variable de entorno si existe y, si no, el valor por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragpeat}
spring.datasource.username=${DB_USER:ragpeat}
spring.datasource.password=${DB_PASSWORD:ragpeat}

# Clave de Voyage (embeddings). Se lee de la variable de entorno; nunca se escribe aquí.
voyage.api-key=${VOYAGE_API_KEY:}

# Claude: la clave sale de la variable de entorno; el modelo se cambia aquí sin tocar código.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-5-5

# La página (html, css, js): el navegador puede guardarla, pero debe preguntar siempre si hay versión nueva.
# Sin esto, tras actualizar la web algunos usuarios seguirían viendo la versión vieja guardada en su caché.
spring.web.resources.cache.cachecontrol.no-cache=true
# La fecha de los archivos dentro del .jar es siempre 1980 (ver WebConfig): no sirve para saber si cambiaron.
spring.web.resources.cache.use-last-modified=false

# Límites del chat público: preguntas por IP en la ventana, y total al día para todo el mundo.
chat.limit.per-ip=20
chat.limit.window-minutes=60
chat.limit.daily=500
# Solo true detrás de nuestro balanceador (AWS): permite leer la IP real de X-Forwarded-For.
chat.trust-proxy=false

# Modelo que hace de juez en la comparación (eval). Más potente que el que responde, y distinto.
eval.judge-model=claude-sonnet-5-5

# Clave del panel privado (/panel). Vacía = panel desactivado. En el servidor la pone deploy.sh desde Parameter Store.
admin.token=${ADMIN_TOKEN:}
