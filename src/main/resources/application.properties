spring.application.name=rag-peat

# Conexión a la base de datos de compose.yaml.
# La sintaxis ${VARIABLE:valor} usa la variable de entorno si existe y, si no, el valor por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragpeat}
spring.datasource.username=${DB_USER:ragpeat}
spring.datasource.password=${DB_PASSWORD:ragpeat}

# Clave de Voyage (embeddings). Se lee de la variable de entorno; nunca se escribe aquí.
voyage.api-key=${VOYAGE_API_KEY:}

# Claude: la clave sale de la variable de entorno; el modelo se cambia aquí sin tocar código.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-5-5

# Modelo que hace de juez en la comparación (eval). Más potente que el que responde, y distinto.
eval.judge-model=claude-sonnet-5-5
